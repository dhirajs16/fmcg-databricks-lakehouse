bundle:
  name: fmcg-acquisition-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    default: workspace
  schema:
    default: fmcg_lakehouse
  landing_volume:
    default: /Volumes/workspace/fmcg_lakehouse/landing

workspace:
  host: https://YOUR_DATABRICKS_WORKSPACE

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
    root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
